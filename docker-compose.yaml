services:

  postgres:
    image: postgres:16.1-alpine
    container_name: cv_app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres_cv
      POSTGRES_PASSWORD: postgres_cv
      POSTGRES_DB: postgres_cv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres_cv" ]
      interval: 5s3
      timeout: 5s
      retries: 5


  redis:
    ...


volumes:
  postgres_data:
